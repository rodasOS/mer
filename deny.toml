# Configuration for `cargo deny` (https://embarkstudios.github.io/cargo-deny/).
#
# Run with `cargo deny check` (CI does it on every push). Vulnerabilities fail the check.
# Crates reported as unmaintained only warn: today they all come from GPUI (pinned, ADR 0001)
# and are tracked in TODO.md.

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI is not on crates.io: it and the forks it needs are pinned to commits by Cargo.lock.
allow-git = [
  "https://github.com/zed-industries/zed",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/oo7",
  "https://github.com/zed-industries/scap",
  "https://github.com/zed-industries/xim-rs.git",
  "https://github.com/gfx-rs/wgpu",
]
